<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>梦女模拟器</title>
  <meta name="description" content="一个他在意你、会主动找你、会吃醋、会已读不回的恋爱模拟游戏">
  <meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2ede8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="梦女模拟器">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="waterCanvas"></canvas>
  <div class="bg-overlay"></div>

  <!-- ====== 首页 ====== -->
  <div class="container" id="landingPage">
    <nav class="glass-nav">
      <span class="nav-logo">梦女模拟器</span>
      <div class="nav-links">
        <a href="#" id="navNewGame">新游戏</a>
        <a href="#" id="navContinue">继续游戏</a>
        <a href="#" id="navImport">导入存档</a>
        <button class="lang-toggle" id="langToggle1" aria-label="切换语言">中/EN</button>
        <button class="theme-toggle" id="themeToggle" aria-label="切换深浅模式">
          <span class="toggle-icon">☾</span>
        </button>
      </div>
    </nav>

    <section class="hero">
      <div class="glass-card hero-card">
        <p class="subtitle">夜深了，打开手机</p>
        <h1>梦女模拟器</h1>
        <p class="desc">
          在深夜的屏幕对面，有一个人<br>
          他会想你、会主动、会吃醋、会已读不回<br>
          像真人一样，用他的方式跟你聊天
        </p>
        <button class="btn-start" id="btnStartGame">开始新游戏</button>
      </div>
    </section>

    <section class="char-entries" id="charEntries">
      <div class="chat-list-header">
        <h2 class="entries-title">消息</h2>
        <button class="add-chat-btn" id="btnAddChat" title="新对话">＋</button>
      </div>
      <div class="chat-list" id="chatList">
        <!-- 由 game.js 动态渲染 -->
      </div>
      <div class="entries-empty hidden" id="entriesEmpty">
        <p>还没有对话，创建第一个故事吧</p>
      </div>
    </section>
  </div>

  <!-- ====== 角色创建 ====== -->
  <div class="game-container hidden" id="createScreen">
    <div class="glass-card create-card">
      <button class="create-back" id="btnCreateBack">← 返回</button>
      <p class="subtitle">创建一个新角色</p>
      <h2>这次想攻略谁？</h2>

      <div class="create-section">
        <label>你的昵称</label>
        <input type="text" class="glass-input" id="playerName" placeholder="输入你的名字…">
      </div>

      <div class="create-section">
        <label>你的性别</label>
        <div class="choice-grid" id="playerGender">
          <button class="glass-chip" data-value="女">女</button>
          <button class="glass-chip" data-value="男">男</button>
          <button class="glass-chip" data-value="非二元">非二元</button>
          <button class="glass-chip" data-value="跨性别女">跨性别女</button>
          <button class="glass-chip" data-value="跨性别男">跨性别男</button>
          <button class="glass-chip" data-value="双性">双性</button>
        </div>
      </div>

      <div class="create-section">
        <label>你的职业</label>
        <div class="choice-grid" id="playerJob">
          <button class="glass-chip" data-value="设计师">设计师</button>
          <button class="glass-chip" data-value="摄影师">摄影师</button>
          <button class="glass-chip" data-value="医生">医生</button>
          <button class="glass-chip" data-value="律师">律师</button>
          <button class="glass-chip" data-value="咖啡店店主">咖啡店店主</button>
          <button class="glass-chip" data-value="老师">老师</button>
          <button class="glass-chip" data-value="自由职业">自由职业</button>
          <button class="glass-chip" data-value="__custom__">✎ 自定义…</button>
        </div>
        <input type="text" class="glass-input hidden" id="playerJobCustom" placeholder="输入你的职业…" maxlength="20" style="margin-top:8px;">
      </div>

      <div class="create-section">
        <label>攻略对象名字</label>
        <input type="text" class="glass-input" id="targetNameInput" placeholder="自定义或留空随机生成…" maxlength="8">
      </div>

      <div class="create-section">
        <label>攻略对象性别</label>
        <div class="choice-grid" id="targetGender">
          <button class="glass-chip" data-value="男">男</button>
          <button class="glass-chip" data-value="女">女</button>
          <button class="glass-chip" data-value="非二元">非二元</button>
          <button class="glass-chip" data-value="跨性别男">跨性别男</button>
          <button class="glass-chip" data-value="跨性别女">跨性别女</button>
          <button class="glass-chip" data-value="双性">双性</button>
        </div>
      </div>

      <div class="create-section">
        <label>攻略对象职业</label>
        <div class="choice-grid" id="targetJob">
          <button class="glass-chip" data-value="医生">医生</button>
          <button class="glass-chip" data-value="警察">警察</button>
          <button class="glass-chip" data-value="律师">律师</button>
          <button class="glass-chip" data-value="咖啡店老板">咖啡店老板</button>
          <button class="glass-chip" data-value="总监">总监</button>
          <button class="glass-chip" data-value="大学老师">大学老师</button>
          <button class="glass-chip" data-value="程序员">程序员</button>
          <button class="glass-chip" data-value="__custom__">✎ 自定义…</button>
        </div>
        <input type="text" class="glass-input hidden" id="targetJobCustom" placeholder="输入攻略对象的职业…" maxlength="20" style="margin-top:8px;">
      </div>

      <div class="create-section">
        <label>攻略对象性格/人设（自定义，留空用默认）</label>
        <textarea class="glass-input persona-input" id="targetPersona" placeholder="例如：高冷毒舌但心软的外科医生，工作狂，不喜欢甜食，有一只猫叫年糕…" maxlength="300"></textarea>
      </div>

      <div class="create-section">
        <label>性偏好 / XP（可多选）</label>
        <div class="choice-grid multi-select" id="targetKinks">
          <button class="glass-chip" data-value="温柔系">温柔系</button>
          <button class="glass-chip" data-value="粗暴系">粗暴系</button>
          <button class="glass-chip" data-value="言语羞辱">言语羞辱</button>
          <button class="glass-chip" data-value="束缚">束缚</button>
          <button class="glass-chip" data-value="支配者">支配者</button>
          <button class="glass-chip" data-value="被支配">被支配</button>
          <button class="glass-chip" data-value="亲吻狂魔">亲吻狂魔</button>
          <button class="glass-chip" data-value="舔">舔</button>
          <button class="glass-chip" data-value="咬/印记">咬/印记</button>
          <button class="glass-chip" data-value="窒息">窒息</button>
          <button class="glass-chip" data-value="角色扮演">角色扮演</button>
          <button class="glass-chip" data-value="野外/车里">野外/车里</button>
          <button class="glass-chip" data-value="浴室">浴室</button>
          <button class="glass-chip" data-value="制服">制服</button>
          <button class="glass-chip" data-value="年上控">年上控</button>
          <button class="glass-chip" data-value="年下控">年下控</button>
          <button class="glass-chip" data-value="酒后">酒后</button>
          <button class="glass-chip" data-value="半推半就">半推半就</button>
          <button class="glass-chip" data-value="强制">强制</button>
          <button class="glass-chip" data-value="偷窥/偷拍">偷窥/偷拍</button>
          <button class="glass-chip" data-value="公开场合">公开场合</button>
          <button class="glass-chip" data-value="撒娇">撒娇</button>
          <button class="glass-chip" data-value="哭">哭</button>
          <button class="glass-chip" data-value="玩具">玩具</button>
        </div>
        <input type="text" class="glass-input" id="targetKinksCustom" placeholder="自定义 XP，用逗号分隔…" maxlength="200" style="margin-top:8px;">
      </div>

      <div class="create-section">
        <label>亲密推进风格</label>
        <div class="choice-grid style-grid" id="paceStyle">
          <button class="glass-chip" data-value="slow">慢热纯爱</button>
          <button class="glass-chip" data-value="moderate">情感为主</button>
          <button class="glass-chip" data-value="fast">纯欲刺激</button>
          <button class="glass-chip" data-value="heavy">重口模式</button>
        </div>
      </div>

      <button class="btn-start" id="btnConfirmCreate">确认 · 进入游戏</button>
    </div>
  </div>

  <!-- ====== 游戏主界面 ====== -->
  <div class="game-container hidden" id="gameScreen">
    <!-- 顶部栏 -->
    <div class="game-topbar glass-nav">
      <button class="icon-btn" id="btnBackHome" title="返回">←</button>

      <div class="char-selector" id="charSelector">
        <span class="char-selector-name" id="currentCharName">攻略对象</span>
        <span class="char-selector-arrow">▾</span>
        <div class="char-dropdown glass-card hidden" id="charDropdown"></div>
        <div class="char-tooltip hidden" id="charTooltip"></div>
      </div>

      <span class="week-label" id="weekLabel">第1周</span>
      <span class="time-label" id="timeLabel">周一 09:00</span>

      <div class="topbar-actions">
        <button class="icon-btn mode-btn" id="btnModeToggle" title="网聊/见面切换">📱</button>
        <button class="icon-btn" id="btnSearch" title="搜索聊天记录">🔍</button>
        <button class="icon-btn" id="btnCreateChar" title="创建新角色">＋</button>
        <button class="icon-btn" id="btnGroupChat" title="创建群聊">👥</button>
        <button class="icon-btn" id="btnExport" title="导出存档">📥</button>
        <button class="icon-btn" id="btnImport" title="导入存档">📤</button>
        <button class="icon-btn" id="btnSync" title="云端同步">🔄</button>
        <button class="icon-btn" id="btnSound" title="音效">🔔</button>
        <button class="icon-btn" id="btnSettings" title="API 设置">⚙</button>
        <button class="lang-toggle" id="langToggle2" aria-label="切换语言">中/EN</button>
        <button class="theme-toggle" id="themeToggle2"><span class="toggle-icon">☾</span></button>
        <input type="file" id="importFileInput" accept=".json" style="display:none">
      </div>
    </div>

    <!-- 搜索条 -->
    <div class="search-bar hidden" id="searchBar">
      <input type="text" class="glass-input" id="searchInput" placeholder="搜索聊天记录…">
      <span class="search-count" id="searchCount"></span>
      <button class="icon-btn" id="btnSearchClose">✕</button>
    </div>

    <div class="game-main">
      <!-- 聊天区 -->
      <div class="chat-area glass-card reveal-stagger" id="chatArea">
        <div class="chat-mode-badge" id="chatModeBadge">📱 网聊模式</div>
        <div class="chat-messages" id="chatMessages"><div class="chat-hint">故事即将开始…</div></div>
        <div class="chat-typing hidden" id="chatTyping">
          <span class="typing-label">对方正在输入…</span>
          <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
        </div>
        <div class="chat-input-row">
          <button class="input-tool-btn" id="btnEmoji" title="表情">😊</button>
          <button class="input-tool-btn" id="btnImage" title="图片">🖼</button>
          <button class="input-tool-btn" id="btnVoice" title="语音">🎤</button>
          <textarea class="chat-input glass-input" id="chatInput" placeholder="输入消息…" rows="1"></textarea>
          <button class="btn-send" id="btnSend">发送</button>
          <input type="file" id="imageInput" accept="image/*" style="display:none">
        </div>
        <div class="emoji-picker hidden" id="emojiPicker"></div>
      </div>
    </div>

    <!-- 浮动数值面板(可收起) -->
    <div class="stats-float glass-card reveal-stagger" id="statsFloat">
      <div class="stats-float-header" id="statsFloatHeader">
        <span id="statsFloatName">攻略对象</span>
        <span class="stats-toggle-icon">▼</span>
      </div>
      <div class="stats-float-body" id="statsFloatBody">
        <div class="stat-mini mood-row"><span>心情</span><span class="mood-emoji" id="moodEmoji">😐</span></div>
        <div class="stat-mini energy-row"><span>精力</span><span class="energy-label" id="energyLabel">正常</span></div>
        <div class="stat-mini"><span>好感</span><div class="stat-bar"><div class="stat-fill" id="statFavor"></div></div></div>
        <div class="stat-mini"><span>熟悉</span><div class="stat-bar"><div class="stat-fill familiar" id="statFamiliar"></div></div></div>
        <div class="stat-mini"><span>心动</span><div class="stat-bar"><div class="stat-fill heart" id="statHeart"></div></div></div>
        <div class="stat-mini"><span>依赖</span><div class="stat-bar"><div class="stat-fill depend" id="statDepend"></div></div></div>
        <div class="stat-mini"><span>吃醋</span><div class="stat-bar"><div class="stat-fill jealous" id="statJealous"></div></div></div>
        <div class="stage-badge-mini" id="stageBadge">陌生</div>
        <div class="scenario-progress" id="scenarioProgress">🏆 剧情节点 0/10</div>
        <button class="btn-next-week" id="btnNextWeek">⏭ 下一周</button>
      </div>
    </div>
  </div>

  <!-- ====== API 设置弹窗 ====== -->
  <div class="modal-overlay hidden" id="apiModal">
    <div class="modal-card glass-card">
      <h3>API 设置</h3>
      <div class="create-section">
        <label>模型平台</label>
        <div class="choice-grid" id="apiProvider">
          <button class="glass-chip selected" data-value="deepseek">DeepSeek</button>
          <button class="glass-chip" data-value="grok">Grok</button>
          <button class="glass-chip" data-value="openai">OpenAI</button>
          <button class="glass-chip" data-value="gemini">Gemini</button>
          <button class="glass-chip" data-value="claude">Claude</button>
        </div>
      </div>
      <div class="create-section"><label>API Key</label><input type="password" class="glass-input" id="apiKey" placeholder="sk-…"></div>
      <div class="create-section"><label>API 地址（可选）</label><input type="text" class="glass-input" id="apiBase" placeholder="默认地址"></div>
      <div class="create-section"><label>模型名称（可选）</label><input type="text" class="glass-input" id="apiModel" placeholder="默认模型"></div>
      <div class="create-section"><label>云同步 · Supabase URL</label><input type="text" class="glass-input" id="supabaseUrl" placeholder="https://xxxxx.supabase.co"></div>
      <div class="create-section"><label>云同步 · Supabase Key</label><input type="password" class="glass-input" id="supabaseKey" placeholder="anon key…"></div>
      <div class="modal-buttons">
        <button class="choice-btn" id="btnTestApi">测试连接</button>
        <button class="btn-start" id="btnSaveApi">保存设置</button>
      </div>
      <p class="api-status" id="apiStatus"></p>
    </div>
  </div>

  <!-- ====== 群聊创建弹窗 ====== -->
  <div class="modal-overlay hidden" id="groupModal">
    <div class="modal-card glass-card">
      <h3>创建群聊</h3>
      <p class="modal-desc">选择要拉入群聊的角色</p>
      <div class="group-char-list" id="groupCharList"></div>
      <button class="btn-start" id="btnCreateGroup">创建群聊</button>
    </div>
  </div>

  <script src="script.js?v=6"></script>
  <script src="sounds.js?v=1"></script>
  <script src="lang.js?v=1"></script>
  <script src="game.js?v=7"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  </script>
</body>
</html>
